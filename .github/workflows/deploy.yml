name: Deploy Firebase

on:
  workflow_call:
    secrets:
      FIREBASE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  deploy-functions:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for deployment changes
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- backend/ .github/workflows/ci.yml .github/workflows/deploy.yml)
            if [[ -n "$changed" ]]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: steps.changes.outputs.deploy == 'true'
        run: npm install -g firebase-tools@15.18.0

      - name: Install function dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: npm ci
        working-directory: backend/functions

      - name: Deploy Firebase Functions and rules
        if: steps.changes.outputs.deploy == 'true'
        run: firebase deploy --only functions,firestore:rules --project bikesetupapp-bd22a --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
