name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flutter ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Prepare test configuration
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Lint
        if: matrix.check == 'lint'
        run: flutter analyze --fatal-infos

      - name: Tests
        if: matrix.check == 'tests'
        run: flutter test

      - name: Browser callback tests
        if: matrix.check == 'tests'
        run: flutter test --platform chrome test/strava_web_callback_test.dart

      - uses: actions/setup-node@v4
        if: matrix.check == 'tests'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: matrix.check == 'tests'
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore repository regression tests
        if: matrix.check == 'tests'
        run: >-
          npx --yes firebase-tools@15.18.0 emulators:exec
          --only firestore --project demo-bike-tests
          --config test/firestore/firebase.repository.json
          "flutter test --platform chrome test/firestore_tests_repository_test.dart"

  firestore-rules:
    name: Firestore ownership rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: test/firestore
      - name: Test production rules
        run: >-
          npx --yes firebase-tools@15.18.0 emulators:exec
          --only firestore --project demo-bike-rules
          "npm --prefix test/firestore test"

  functions:
    name: Strava function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test OAuth handlers
        run: npm test
        working-directory: functions
