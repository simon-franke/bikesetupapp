flutter_launcher_icons:
  # Exported from ios/Runner/AppIcon.icon with Apple Icon Composer.
  image_path: "assets/app-icon/launcher.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_foreground: "ios/Runner/AppIcon.icon/Assets/top-cap.png"
  adaptive_icon_background: "#0D2035"

  # iOS builds the Icon Composer document directly.
  ios: false

  windows:
    generate: true
    icon_size: 48

  macos:
    generate: true
